name: Publish Invariant Earth MCP

on:
  push:
    tags: ['earth-mcp-registry-v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Download and verify MCP Publisher
        run: |
          curl --fail --silent --show-error --location --retry 2 \
            --output mcp-publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.16/mcp-publisher_linux_amd64.tar.gz
          printf '%s\n' '6e2f799550cf843c6fd3350498d56cc49be3dc0af1e6237eb0e6435c7a9d5c05  mcp-publisher.tar.gz' | sha256sum --check --strict
          tar -xzf mcp-publisher.tar.gz mcp-publisher
      - name: Validate registry listing
        run: |
          jq -e --arg version "${GITHUB_REF_NAME#earth-mcp-registry-v}" '.version == $version' server.json
          ./mcp-publisher validate server.json
      - name: Publish registry listing
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish server.json
